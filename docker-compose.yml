version: '3.8'
services:
  db:
    image: postgres:15-alpine
    container_name: railblock-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: railblock_user
      POSTGRES_PASSWORD: railblock_secure_pass
      POSTGRES_DB: railblock_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U railblock_user -d railblock_db"]
      interval: 5s
      timeout: 5s
      retries: 5
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: railblock-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://railblock_user:railblock_secure_pass@db:5432/railblock_db
      - PORT=8000
    ports:
      - "8000:8000"
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: railblock-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      - VITE_API_URL=http://localhost:8000
    ports:
      - "3000:3000"
volumes:
  postgres_data: